controllers:
  main:
    annotations:
      # Force to reload because configmap or secret changed. Use kustomization to generate maps with suffix instead.
      reloader.stakater.com/auto: "true"
    # Do not use replicas since it will be managed by KEDA, so argocd does not detect diffs.
    # replicas: 1
    containers:
      main:
        image:
          repository: ghcr.io/joeferner/redis-commander
          tag: latest@sha256:832ee959940dd32f9dfdb700616641124c06a96aa1fb0a9a80f5097499b6fd90
        envFrom:
          - secretRef:
              name: redis-commander-secret
        env:
          TZ: Europe/Madrid
          PORT: &port 80
        resources:
          requests:
            cpu: 15m

defaultPodOptions:
  securityContext:
    runAsUser: 10000
    runAsGroup: 10000
    fsGroup: 10000
    fsGroupChangePolicy: OnRootMismatch

service:
  main:
    controller: main
    ports:
      http:
        port: *port
